name: Build and test dot question

'on':
  push:
    branches: [main]
    paths:
      - 'dot-question-mac/**'
      - 'dot-question-windows/**'
      - 'ci/**'
      - '.github/workflows/build-test.yml'
  workflow_dispatch:
    inputs:
      platform:
        description: Build only the platform you need to conserve quota
        type: choice
        options: [macos, windows, both]
        default: macos
        required: true

permissions:
  contents: read

concurrency:
  group: dot-question-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    if: github.event_name == 'push' || inputs.platform == 'macos' || inputs.platform == 'both'
    runs-on: macos-15
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: dot-question-mac
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Select preinstalled Xcode for this job only
        run: bash ../ci/select-xcode.sh
      - name: Static checks
        run: |
          bash -n build.command
          python3 scripts/check_source.py
      - name: XCTest and release application
        run: bash build.command
      - name: Capture actual AppKit views with isolated synthetic fixtures
        run: '"dist/dot question.app/Contents/MacOS/DotQuestion" --smoke-test --screenshots-dir "$PWD/dist/screenshots"'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dot-question-macos-screenshots
          path: dot-question-mac/dist/screenshots
          if-no-files-found: error
          retention-days: 1
      - name: Package ad-hoc-signed arm64 application
        run: |
          test "$(uname -m)" = arm64
          lipo 'dist/dot question.app/Contents/MacOS/DotQuestion' -verify_arch arm64
          ditto -c -k --sequesterRsrc --keepParent 'dist/dot question.app' dist/dot-question-macos-arm64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dot-question-macos-arm64
          path: dot-question-mac/dist/dot-question-macos-arm64.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Record actual desktop and global shortcut with a real local model
        run: bash ../ci/record-mac-live.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: dot-question-macos-live-video
          path: dot-question-mac/dist/live-video
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  windows:
    if: github.event_name == 'push' || inputs.platform == 'windows' || inputs.platform == 'both'
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    defaults:
      run:
        shell: pwsh
        working-directory: dot-question-windows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build and test requirements
        run: python -m pip install --no-cache-dir -r requirements-build.txt
      - name: Run all synthetic and offscreen tests
        run: python ../ci/test-windows.py
      - name: Capture actual Qt widgets with synthetic fixtures
        run: python ../ci/screenshot-windows.py dist/screenshots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dot-question-windows-screenshots
          path: dot-question-windows/dist/screenshots
          if-no-files-found: error
          retention-days: 1
      - name: Build unsigned Windows application
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name DotQuestion app.py
      - name: Package complete application folder
        run: |
          if (-not (Test-Path dist/DotQuestion/DotQuestion.exe)) { throw 'Missing executable' }
          Compress-Archive -Path dist/DotQuestion -DestinationPath dist/dot-question-windows-x64.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dot-question-windows-x64-unsigned
          path: dot-question-windows/dist/dot-question-windows-x64.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
